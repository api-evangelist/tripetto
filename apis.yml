aid: tripetto
name: Tripetto
description: >-
  Tripetto is a powerful form builder platform and SDK that enables developers to create smart, conversational forms and
  surveys with advanced conditional logic. The platform provides a JavaScript/TypeScript SDK for embedding form builders
  and runners into web applications, along with webhook capabilities for delivering form responses to external services
  and automation platforms.
